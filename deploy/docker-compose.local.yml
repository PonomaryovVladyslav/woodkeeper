# Local run of the production setup (stage 13), on top of docker-compose.yml:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.local.yml \
#     --env-file deploy/.env.local up --build
# Opens https://localhost (Caddy's own certificate: the browser warns once).
services:
  app:
    # Same architecture as the server (x86_64), emulated on Apple Silicon. Besides parity,
    # the arm64 wheel of cryptography 50 crashes with SIGILL in Docker Desktop's VM.
    platform: linux/amd64
    build:
      context: ..
      dockerfile: Dockerfile
      platforms: [linux/amd64]
    image: woodkeeper:local
    env_file: !override .env.local

  caddy:
    command: caddy run --config /etc/caddy/Caddyfile.local --adapter caddyfile
